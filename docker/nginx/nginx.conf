server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Szablony z public/views i każdy inny plik PHP nie mogą się uruchamiać same, z pominięciem routera.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
